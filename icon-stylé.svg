<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.62" r="0.5"><stop offset="0" stop-color="#1f8a52" stop-opacity=".38"/><stop offset="1" stop-color="#1f8a52" stop-opacity="0"/></radialGradient>
<linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc27e"/><stop offset="1" stop-color="#1a7a47"/></linearGradient>
<linearGradient id="r" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8a52"/><stop offset="1" stop-color="#0d4f2c"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="0" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter></defs>
<rect width="512" height="512" rx="116" fill="url(#bg)"/>
<rect width="512" height="512" rx="116" fill="url(#glow)"/>
<rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#edge)" stroke-width="3"/>
<!-- bras droit (derrière) -->
<polygon points="300,128 396,128 290,392 234,392" fill="url(#r)"/>
<!-- bras gauche (devant) -->
<polygon points="116,128 212,128 290,392 234,392" fill="url(#l)" filter="url(#sh)"/>
<!-- reflet -->
<polygon points="116,128 212,128 216,142 122,142" fill="#fff" opacity=".18"/>
</svg>
