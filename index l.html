<style>
/* anti-zoom */html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}*{touch-action:manipulation}input,select,textarea,.f{font-size:16px!important}

:root{--bg:#f3f6f4;--card:#fff;--ink:#12201a;--mut:#6b7a72;--line:#e4ebe7;--g:#0f4a34;--g2:#1c7a52;--soft:#e3f2ea;--inp:#f3f6f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1411;--card:#16211c;--ink:#e8f1ec;--mut:#8fa398;--line:#243129;--soft:#1b3328;--inp:#0f1a15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1411;--card:#16211c;--ink:#e8f1ec;--mut:#8fa398;--line:#243129;--soft:#1b3328;--inp:#0f1a15;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.35 Poppins,system-ui,sans-serif}
#app{height:100%;max-width:430px;margin:auto;display:flex;flex-direction:column;position:relative}
#view{flex:1;overflow-y:auto;padding:14px 16px 24px}
h1{font-size:24px;font-weight:700}.back{border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px 6px 10px;font:600 13px Poppins,sans-serif;margin-bottom:10px;box-shadow:0 1px 4px #0001}.mut{color:var(--mut);font-size:12px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.hero{background:linear-gradient(160deg,#0f4a34,#0a2e21);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px}
.hero .big{font-size:34px;font-weight:700;margin:2px 0}
.pill{background:#7cf0a8;color:#0a3b27;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.hero .foot{background:#ffffff18;border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 1px 4px #0001}
.tile b{display:block;font-size:20px}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.sec{display:flex;justify-content:space-between;font-weight:600;margin:16px 0 8px}.sec a{color:var(--g2);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px;margin-bottom:6px}
.qa .ic{width:46px;height:46px;margin:0 auto 4px;font-size:20px;border-radius:15px}
.item{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:18px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 4px #0001}
.item .m{flex:1;min-width:0}.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{text-align:right;font-weight:700}.price small{display:block;color:var(--g2);font-size:11px}
.chip{display:inline-block;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:600;border:0;margin-right:5px}
.s-ship{background:#dbeafe;color:#1d4ed8}.s-deliv{background:#dcfce7;color:#15803d}.s-todo{background:#fef3c7;color:#b45309}
.s-online{background:#ede9fe;color:#6d28d9}.s-stock{background:#e0e7e4;color:#2f4a3e}.s-res{background:#ffedd5;color:#c2410c}
.dots{border:0;background:var(--inp);color:var(--mut);border-radius:50%;width:26px;height:26px;font:inherit;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
.tabs button{border:0;border-radius:20px;padding:7px 14px;background:var(--card);color:var(--ink);font:600 13px Poppins,sans-serif;white-space:nowrap}
.tabs .on{background:#0a1f17;color:#fff}
.search{width:100%;border:0;border-radius:16px;padding:12px 14px;background:var(--card);color:var(--ink);font:inherit}
.hint{background:#dcf3e4;color:#14532d;border-radius:14px;padding:10px 12px;font-size:12px;margin:8px 0}
.prem{background:linear-gradient(120deg,#0f4a34,#0a2e21);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.lst .item{cursor:pointer}.lst .t+div{color:var(--mut);font-size:12px}
nav{display:flex;align-items:center;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 4px 10px}
nav button{border:0;background:none;color:var(--mut);font:600 11px Poppins,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;border-radius:14px}
nav button.on{color:var(--g2)}nav button.on svg{background:var(--soft);border-radius:10px;padding:3px;width:28px;height:28px}
nav .fab{background:var(--g);color:#fff;width:54px;height:54px;border-radius:50%;justify-content:center;margin-top:-26px;box-shadow:0 0 0 5px var(--bg),0 4px 12px #0004;padding:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:8px}textarea.f{resize:none}summary{cursor:pointer}#shade{position:absolute;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#sheet{background:var(--card);width:100%;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-weight:600;margin:12px 0 6px}
input.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:11px}
.cats>div{padding:8px 2px;border-radius:14px;border:2px solid transparent}.cats .on,.pick .on{border-color:var(--g2)!important}
.cats .ic{margin:0 auto 3px}.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick span{padding:6px 14px;border-radius:20px;background:var(--inp);border:2px solid transparent;font-weight:600}
.pick i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:block}
.btn{width:100%;border:0;border-radius:16px;padding:14px;background:var(--g);color:#fff;font:600 15px Poppins,sans-serif;margin-top:16px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#0a1f17;color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;display:none;z-index:20}
</style><script>
/* anti-zoom : pincement (iPhone), double-tap, Ctrl+molette */
(function(){var o={passive:false};
['gesturestart','gesturechange','gestureend'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()},o)});
document.addEventListener('touchmove',function(ev){if(ev.touches.length>1||(ev.scale&&ev.scale!==1))ev.preventDefault()},o);
var last=0;document.addEventListener('touchend',function(ev){var t=Date.now();if(t-last<300&&!/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))ev.preventDefault();last=t},o);
document.addEventListener('wheel',function(ev){if(ev.ctrlKey)ev.preventDefault()},o);
document.addEventListener('keydown',function(ev){if((ev.ctrlKey||ev.metaKey)&&/^(\+|-|=|0)$/.test(ev.key))ev.preventDefault()});
})();
</script>

let am='in',aerr='',PH=[],DB=null,UR=null;const OWNER_EMAIL='fuxishort@gmail.com',isOwn=()=>U===OWNER_EMAIL;const CONTACT_EMAIL='',APP_URL='https://claude.ai/artifact/QHXmim9r9aaWpr8bNJ3RcA';
(async()=>{try{DB=await claude.use('db');UR=await claude.use('user')}catch(e){}})();
async function remote(patch){if(!DB||!UR)return false;try{const id=await UR.id();if(!id)return false;const r=DB.doc('inbox/'+id),s=await r.get(),d=s.exists?{...s.data()}:{};await r.set({...d,...patch(d),from:S.name||'',email:U||''});return true}catch(e){return false}}
async function doSend(k,t){const m={k,t,sent:false};(S.msgs=S.msgs||[]).unshift(m);m.sent=await remote(d=>({msgs:[...(d.msgs||[]),{k,t,ts:Date.now()}].slice(-50)}));save();render();toast(m.sent?'Message envoyé ✓':'Message enregistré sur cet appareil');if(!m.sent&&CONTACT_EMAIL)sheet(`<button class='back' data-act='close'>‹ Retour</button><p style='margin:10px 0'>L’envoi direct n’est pas disponible pour ce compte. Envoie ton message par e-mail :</p><a class='btn' style='display:block;text-align:center;text-decoration:none' href='mailto:${CONTACT_EMAIL}?subject=Vintrack&body=${encodeURIComponent(t)}'>Envoyer par e-mail</a>`)}
async function doRate(){if(!S.rate)return toast('Choisis une note');save();const ok=await remote(()=>({rate:{n:S.rate,ts:Date.now()}}));close();toast(ok?'Merci pour ta note ✓':'Note enregistrée sur cet appareil')}

async function loadFriends(){const b=$('#fr');if(!b)return;try{if(!DB||!UR)throw 0;const uid=await UR.id();if(!uid)throw 0;const p=S.pseudo,reg=p?await DB.doc('pseudos/'+p).get():null;

+(out.length?`<div class='sec'>Demandes envoyées</div>`+out.map(r=>ln(r,btn('fcan',r,r.st==='dec'?'Refusée · OK':'Annuler','s-stock'))).join(''):'')}

async function claim(){const p=pn($('#ps').value);if(!PX.test(p))return toast('Pseudo invalide');try{const uid=await UR.id(),r=DB.doc('pseudos/'+p),l=await r.acquire({holder:uid,ttlMs:5000});if(!l.acquired)return toast('Réessaie dans un instant');const s=await r.get(),o=s.exists&&s.data().uid;if(o&&o!==uid)return toast('Pseudo déjà pris');await r.set({uid,name:S.name||''});S.pseudo=p;save();loadFriends()}catch(e){toast('Action impossible')}}
async function freq(){const to=pn($('#fp').value),me=S.pseudo;if(!PX.test(to))return toast('Pseudo invalide');if(to===me)return toast('C’est ton propre pseudo');try{const t=await DB.doc('pseudos/'+to).get();if(!t.exists)return toast('Aucun utilisateur avec ce pseudo');const r=DB.doc('requests/'+pid(me,to)),s=await r.get(),d=s.exists?s.data():null;
if(d&&d.st==='acc')return toast('Vous êtes déjà amis');if(d&&d.st==='pen')return toast(d.from===me?'Demande déjà envoyée':'Cette personne t’a déjà écrit : accepte sa demande');await r.set({from:me,to,st:'pen',ts:Date.now()});toast('Demande envoyée ✓');loadFriends()}catch(e){toast('Action impossible')}}
async function fset(id,st){try{const r=DB.doc('requests/'+id);if(st==='del')await r.delete();else await r.update({st});loadFriends()}catch(e){toast('Action impossible')}}
async function loadInbox(){const b=$('#ib');if(!b||!isOwn())return;try{const s=await DB.collection('inbox').get(),rows=s.docs.map(d=>({id:d.id,...d.data()})),rs=rows.filter(r=>r.rate),avg=rs.length?rs.reduce((a,r)=>a+r.rate.n,0)/rs.length:0,ms=rows.flatMap(r=>(r.msgs||[]).map(m=>({...m,from:r.from,email:r.email}))).sort((a,b)=>b.ts-a.ts);
b.innerHTML=`<div class='tiles' style='grid-template-columns:1fr 1fr'><div class='tile'><b>${rs.length?n2(avg)+' ⭐':'—'}</b><span class='mut'>${rs.length} note(s)</span></div><div class='tile'><b>${ms.length}</b><span class='mut'>Message(s)</span></div></div>`+(rs.length?card('<b>Notes</b>'+rs.map(r=>`<div class='row sp' style='margin-top:6px'><span>${esc(r.from||'')} <span class='mut'>${esc(r.email||'')}</span></span><b>${r.rate.n} ⭐</b></div>`).join('')):'')+(ms.map(m=>card(`<div class='row sp'><b>${esc(m.from||'')}</b><span class='mut'>${m.k==='collab'?'Collaboration':'Contact'} · ${new Date(m.ts).toLocaleDateString('fr-FR')}</span></div><div class='mut'>${esc(m.email||'')}</div><p style='margin-top:6px'>${esc(m.t)}</p>`)).join('')||`<p class='mut'>Aucun message pour le moment.</p>`)}catch(e){b.textContent='Boîte de réception indisponible.'}}
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hp(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(s),iterations:100000},k,256))}

async function doAuth(){const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,us=users(),fail=m=>{aerr=m;$('#aerr').textContent=m};
if(!/^\S+@\S+\.\S+$/.test(e))return fail('Adresse e-mail invalide');if(p.length<6)return fail('Mot de passe : 6 caractères minimum');
try{if(am==='up'){if(us[e])return fail('Un compte existe déjà avec cet e-mail');const salt=hx(crypto.getRandomValues(new Uint8Array(16))),first=!Object.keys(us).length;us[e]={salt,h:await hp(p,salt),name:$('#an').value.trim()||e.split('@')[0]};localStorage.setItem('vintelis_users',JSON.stringify(us));login(e,first)}
else{const u=us[e];if(!u||u.h!==await hp(p,u.salt))return fail('E-mail ou mot de passe incorrect');login(e)}}catch(x){fail('Connexion impossible sur ce navigateur')}}
function login(e,first){U=e;try{localStorage.setItem('vintelis_session',e)}catch(x){}let d=null;try{d=JSON.parse(localStorage.getItem('vintelis:'+e)||(first?localStorage.getItem('vintelis'):null)||'null')}catch(x){}
S=d||(first?seed():{goal:0,closed:false,items:[],sales:[]});S.fees=S.fees||[];S.name=users()[e].name;save();applyTheme();tab='home';hist=[];render()}
function logout(){U=null;try{localStorage.removeItem('vintelis_session')}catch(x){}am='in';aerr='';render()}
const thumb=(o,k)=>o.ph&&o.ph.length?`<img src='${o.ph[0]}' data-act='view' data-k='${k}' data-id='${o.id}' style='width:38px;height:38px;object-fit:cover;border-radius:11px;flex:none'>`:`<div class='ic' style='background:${CATS[o.cat][2]}'>${CATS[o.cat][1]}</div>`;
function drawPh(){const b=$('#phs');if(b)b.innerHTML=PH.map((p,i)=>`<div style='position:relative'><img src='${p}' style='width:64px;height:64px;object-fit:cover;border-radius:12px;display:block'><button class='dots' data-act='rmph' data-id='${i}' style='position:absolute;top:-6px;right:-6px;width:20px;height:20px;font-size:10px'>✕</button></div>`).join('')+(PH.length<4?`<div data-act='pickph' style='width:64px;height:64px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-size:22px'>📷</div>`:'')}
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)})}
document.addEventListener('change',async e=>{if(e.target.id!=='pf')return;for(const f of e.target.files){if(PH.length>=4)break;const d=await shrink(f);if(d)PH.push(d)}e.target.value='';drawPh()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!U&&e.target.id)doAuth()});
try{const e=localStorage.getItem('vintelis_session');if(e&&users()[e])login(e)}catch(x){}
function render(){if(!U)return auth();$('#view').innerHTML=(hist.length?'<button class="back" data-act="back">‹ Retour</button>':'')+V[tab]();$('#nav').innerHTML=[['home','home','Accueil'],['stock','box','Stock'],['add','plus',''],['sales','chat','Ventes'],['more','dots','Plus']].map(a=>a[0]==='add'?`<button class="fab" data-act="add">${svg('plus')}</button>`:`<button class="${tab===a[0]||(a[0]==='more'&&!['home','stock','sales'].includes(tab))?'on':''}" data-go="${a[0]}">${svg(a[1])}${a[2]}</button>`).join('')}
function addForm(){sheet(`<button class="back" data-act="close">‹ Retour</button><h1 style="font-size:20px">Nouvel article</h1><div class="mut">Ajoutez à votre stock</div><label>Photos <span class="mut">(facultatif)</span></label><div id="phs" class="row" style="flex-wrap:wrap"></div><input id="pf" type="file" accept="image/*" multiple hidden><label>Nom *</label><input class="f" id="n" placeholder="Ex : Veste en jean Levi’s"><label>Marque</label><input class="f" id="b" placeholder="Ex : Nike, Zara, Sézane…">
<label>Catégorie *</label><div class="cats" id="cat">${Object.entries(CATS).map(([k,v])=>`<div data-c="${k}"><div class="ic" style="background:${v[2]}">${v[1]}</div>${v[0]}</div>`).join('')}</div>
<label>Taille</label><div class="pick" id="sz">${['Unique','XS','S','M','L','XL'].map(s=>`<span>${s}</span>`).join('')}</div><label>Couleur</label><div class="pick" id="co">${COLS.map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join('')}</div>
<div class="row"><div><label>Prix d’achat</label><input class="f" id="buy" type="number" inputmode="decimal" placeholder="0 €"></div><div><label>Prix de vente *</label><input class="f" id="sell" type="number" inputmode="decimal" placeholder="0 €"></div></div><button class="btn" data-act="save">Enregistrer</button>`);PH=[];drawPh()}
const pickOne=(e,sel)=>{const t=e.target.closest(sel);if(!t)return;t.parentNode.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));t.classList.add('on')};
document.addEventListener('click',e=>{const T=e.target;
if(T.closest('#cat'))return pickOne(e,'[data-c]');if(T.closest('#sz'))return pickOne(e,'span');if(T.closest('#co'))return pickOne(e,'i');
const go=T.closest('[data-go]');if(go){const t=go.dataset.go;if(t!==tab){hist=t==='home'?[]:[...hist,tab].slice(-20);tab=t}render();return void($('#view').scrollTop=0)}
if(T.dataset.fi){fI=T.dataset.fi;return render()}if(T.dataset.fs){fS=T.dataset.fs;return render()}
const a=T.closest('[data-act]');if(!a)return;const id=+a.dataset.id,act=a.dataset.act;
if(act==='back'){tab=hist.pop()||'home';render();$('#view').scrollTop=0}else if(act==='close')close();else if(act==='add')addForm();else if(act==='x'){S.closed=true;save();render()}
else if(act==='cyc'){const s=S.sales.find(x=>x.id===id);s.st={todo:'ship',ship:'deliv',deliv:'todo'}[s.st];save();render()}
else if(act==='goal')sheet(`<button class="back" data-act="close">‹ Retour</button><h1 style="font-size:20px">Objectif du mois</h1><label>Combien voulez-vous gagner ce mois-ci ?</label><input class="f" id="goal" type="number" inputmode="decimal" value="${S.goal||''}" placeholder="Ex : 300 €"><button class="btn" data-act="setgoal">Valider</button>`);
else if(act==='setgoal'){S.goal=+$('#goal').value||0;save();close();render()}
else if(act==='menu'){const i=S.items.find(x=>x.id===id);sheet(`<button class="back" data-act="close">‹ Retour</button><h1 style="font-size:18px">${esc(i.n)}</h1><button class="btn" data-act="sell" data-id="${id}">Marquer comme vendu · ${eur(i.sell)}</button><button class="btn" style="background:var(--inp);color:var(--ink)" data-act="del" data-id="${id}">Supprimer</button>`)}
else if(act==='sell'){const i=S.items.find(x=>x.id===id);S.items=S.items.filter(x=>x!==i);S.sales.push({id:Date.now(),n:i.n,p:i.sell,pr:i.sell-i.buy,st:'todo',d:new Date().toISOString().slice(0,10),cat:i.cat,ph:i.ph});save();close();render();toast('Vente enregistrée 🎉')}
else if(act==='del'){S.items=S.items.filter(x=>x.id!==id);save();close();render()}
else if(act==='claim')claim();else if(act==='freq')freq();else if(act==='facc')fset(a.dataset.p,'acc');else if(act==='fdec')fset(a.dataset.p,'dec');else if(act==='fcan')fset(a.dataset.p,'del');else if(act==='frref')loadFriends();
else if(act==='logout'){close();logout()}
else if(act==='auth')doAuth();
else if(act==='amode'){am=am==='up'?'in':'up';aerr='';render()}
else if(act==='pickph')$('#pf').click();
else if(act==='rmph'){PH.splice(id,1);drawPh()}
else if(act==='view'){const o=(a.dataset.k==='i'?S.items:S.sales).find(x=>x.id===id);if(o)sheet(`<button class='back' data-act='close'>‹ Retour</button><h1 style='font-size:18px'>${esc(o.n)}</h1><div style='display:grid;gap:10px;margin-top:10px'>${o.ph.map(p=>`<img src='${p}' style='width:100%;border-radius:16px'>`).join('')}</div>`)}
else if(act==='reset'){S=seed();S.fees=[];S.name=users()[U].name;save();applyTheme();render();toast('Données réinitialisées')}
else if(act==='addfee'){const n=$('#fn').value.trim(),v=parseFloat($('#fa').value);if(!n||isNaN(v))return toast('Libellé et montant requis');S.fees.unshift({id:Date.now(),n,a:v,d:new Date().toISOString().slice(0,10)});save();render()}
else if(act==='delfee'){S.fees=S.fees.filter(x=>x.id!==id);save();render()}
else if(act==='quote'){mq=(mq+1)%QU.length;render()}
else if(act==='theme'){S.theme=a.dataset.id;applyTheme();save();render()}
else if(act==='prem'){S.prem=Date.now()+3*864e5;save();render();toast('Essai activé 🎉')}
else if(act==='send'){const t=$('#msg').value.trim();if(!t)return toast('Écrivez un message');doSend(a.dataset.id,t)}
else if(act==='export'){try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Données copiées')).catch(()=>toast('Copie impossible'))}catch(e){toast('Copie impossible')}}
else if(act==='share')sheet(`<button class='back' data-act='close'>‹ Retour</button><h1 style='font-size:20px'>Partager Vintrack</h1><p class='mut'>Envoie ce lien à tes amis revendeurs.</p><input class='f' id='lk' readonly value='${APP_URL}' style='margin:10px 0'><button class='btn' style='margin:0 0 8px' data-act='copylk'>Copier le lien</button>${navigator.share?`<button class='btn' style='margin:0;background:var(--inp);color:var(--ink)' data-act='nshare'>Partager…</button>`:''}`)
else if(act==='copylk'){const i=$('#lk');i.focus();i.select();i.setSelectionRange(0,999);let ok=false;try{ok=document.execCommand('copy')}catch(x){}if(ok)toast('Lien copié ✓');else try{navigator.clipboard.writeText(APP_URL).then(()=>toast('Lien copié ✓')).catch(()=>toast('Maintiens le lien pour le copier'))}catch(x){toast('Maintiens le lien pour le copier')}}
else if(act==='nshare')navigator.share({title:'Vintrack',text:'Suis tes reventes avec Vintrack',url:APP_URL}).catch(()=>{})
else if(act==='rate')sheet(`<button class='back' data-act='close'>‹ Retour</button><h1 style='font-size:20px'>Noter l’application</h1><div id='stars' class='row' style='justify-content:center;font-size:36px;margin:14px 0'>${[1,2,3,4,5].map(n=>`<span data-act='star' data-id='${n}' style='opacity:${n<=(S.rate||0)?1:.25}'>⭐</span>`).join('')}</div><button class='btn' data-act='sendrate'>Envoyer</button>`)
else if(act==='star'){S.rate=+a.dataset.id;document.querySelectorAll('#stars span').forEach((s,j)=>s.style.opacity=j<S.rate?1:.25)}
else if(act==='sendrate')doRate()
else if(act==='save'){const n=$('#n').value.trim(),c=$('#cat .on'),sell=parseFloat($('#sell').value);if(!n||!c||isNaN(sell))return toast('Nom, catégorie et prix de vente requis');
const sz=$('#sz .on'),co=$('#co .on');S.items.unshift({id:Date.now(),ph:PH.slice(),n,b:$('#b').value.trim(),s:sz?sz.textContent:'',c:co?{'#111':'Noir','#fff':'Blanc','#94a3b8':'Gris','#e5d3b8':'Beige','#8b5a2b':'Marron','#ef4444':'Rouge','#f472b6':'Rose','#f97316':'Orange','#facc15':'Jaune','#16a34a':'Vert','#3b82f6':'Bleu','#8b5cf6':'Violet'}[co.dataset.c]:'',buy:parseFloat($('#buy').value)||0,sell,st:'stock',cat:c.dataset.c});save();close();tab='stock';render();toast('Article ajouté ✓')}});
document.addEventListener('input',e=>{if(e.target.closest('#calc'))calc();if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
render();
